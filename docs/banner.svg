<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">prioritization-formula</title>
<desc id="d">Three panels from the repo's example run, an illustrative coffee roaster. 1, the request: Help me prioritize the next build for our coffee roasting business, with notes such as The retail storefront looks dated, nobody has scoped it. 2, the formula ((CN + BO) / E) x C = Priority and one derivation: wholesale reorder portal, Raw = (CN 3 + BO1 3 + BO2 0) / E 2 = 6 / 2 = 3.00, Priority = 3.00 x 0.70 = 2.10. 3, the ranking: Wholesale reorder portal 2.10, Subscription flavor quiz 1.80, Retail storefront redesign 0.55, Single-origin premium tier -0.12, with the sniff-test flag on the quiz: E=1 is doing the work here, not demand.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.r2{animation:r2 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
.rh{animation:rh 12s infinite}
.ri{animation:ri 12s infinite}
.rj{animation:rj 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,20.4%{opacity:0}22.1%,100%{opacity:1}}
@keyframes r2{0%,16.7%{opacity:1}18.7%,28.9%{opacity:0}30.6%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,50%{opacity:0}51.7%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,55.1%{opacity:0}56.8%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,61%{opacity:0}62.7%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,71.2%{opacity:0}72.9%,100%{opacity:1}}
@keyframes rg{0%,16.7%{opacity:1}18.7%,73.7%{opacity:0}75.4%,100%{opacity:1}}
@keyframes rh{0%,16.7%{opacity:1}18.7%,76.3%{opacity:0}78%,100%{opacity:1}}
@keyframes ri{0%,16.7%{opacity:1}18.7%,78.8%{opacity:0}80.5%,100%{opacity:1}}
@keyframes rj{0%,16.7%{opacity:1}18.7%,84.8%{opacity:0}86.5%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">prioritization-formula</text>
<text x="322" y="50" class="sans" font-size="13.5" fill="#a9adb2">A portable agent skill that scores and ranks competing work</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · AN UNSCORED LIST</text>
<rect x="32" y="98" width="246" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="246" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">examples/example-run.md · example</text>
<line x1="33" y1="123" x2="277" y2="123" stroke="#2e3237"/>
<g class="r1"><rect x="44" y="131" width="210" height="112" rx="10" fill="#2a2e33"/><text x="56" y="150" class="sans" font-size="10.5" fill="#e4dfd4">Help me prioritize the next build</text><text x="56" y="164" class="sans" font-size="10.5" fill="#e4dfd4">for our coffee roasting business.</text><g fill="#3d4248"><rect x="56" y="173" width="172" height="3"/><rect x="56" y="180" width="140" height="3"/></g></g>
<g class="r2"><text x="56" y="203" class="sans" font-size="10.5" fill="#e4dfd4">The retail storefront looks dated,</text><text x="56" y="217" class="sans" font-size="10.5" fill="#e4dfd4">nobody has scoped it.</text><g fill="#3d4248"><rect x="56" y="226" width="160" height="3"/><rect x="56" y="233" width="96" height="3"/></g></g>
<text x="32" y="272" class="sans cap">Four ideas, rough notes, no scores yet.</text>
</g>

<g>
<text x="298" y="88" class="sans lab" fill="#c8963e">2 · THE ARITHMETIC, SHOWN</text>
<rect x="298" y="98" width="290" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h2" x="298" y="98" width="290" height="152" rx="3" stroke="#c8963e"/>
<text x="310" y="115" class="mono" font-size="10" fill="#8b9096">README.md</text>
<line x1="299" y1="123" x2="587" y2="123" stroke="#2e3237"/>
<g class="rb"><text x="310" y="143" class="mono" font-size="11" fill="#e4dfd4" font-weight="700">((CN + BO) / E) x C = Priority</text></g>
<g class="rc"><line x1="310" y1="156.5" x2="576" y2="156.5" stroke="#2e3237"/><text x="310" y="174" class="mono" font-size="10" fill="#8b9096">examples/example-run.md:63</text><text x="310" y="190" class="sans" font-size="10.5" fill="#e4dfd4">Derivation, wholesale reorder portal:</text></g>
<g class="rd"><text x="310" y="207" class="mono" font-size="10" fill="#e4dfd4">Raw = (CN 3 + BO1 3 + BO2 0) / E 2</text><text x="310" y="221" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">    = 6 / 2 = 3.00</text></g>
<g class="re"><text x="310" y="238" class="mono" font-size="10" fill="#e4dfd4">Priority = 3.00 x 0.70 = <tspan fill="#93ad8c" font-weight="700">2.10</tspan></text></g>
<text x="298" y="272" class="sans cap">The formula and its arithmetic, written out.</text>
</g>

<g>
<text x="608" y="88" class="sans lab" fill="#93ad8c">3 · RANKED AND FLAGGED</text>
<rect x="608" y="98" width="260" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="608" y="98" width="260" height="152" rx="3" stroke="#93ad8c"/>
<text x="620" y="115" class="mono" font-size="10" fill="#8b9096">examples/example-run.md · example</text>
<line x1="609" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="rf"><text x="620" y="145" class="sans" font-size="10.5" fill="#e4dfd4">Wholesale reorder portal</text><text x="856" y="145" class="mono" font-size="10" fill="#93ad8c" text-anchor="end">2.10</text></g>
<g class="rg"><text x="620" y="163" class="sans" font-size="10.5" fill="#e4dfd4">Subscription flavor quiz</text><text x="856" y="163" class="mono" font-size="10" fill="#e4dfd4" text-anchor="end">1.80</text></g>
<g class="rh"><text x="620" y="181" class="sans" font-size="10.5" fill="#e4dfd4">Retail storefront redesign</text><text x="856" y="181" class="mono" font-size="10" fill="#e4dfd4" text-anchor="end">0.55</text></g>
<g class="ri"><text x="620" y="199" class="sans" font-size="10.5" fill="#e4dfd4">Single-origin premium tier</text><text x="856" y="199" class="mono" font-size="10" fill="#e4dfd4" text-anchor="end">-0.12</text></g>
<rect class="rj" x="615" y="151.5" width="246" height="16" fill="none" stroke="#c8963e" stroke-dasharray="3 2"/>
<g class="rj"><line x1="620" y1="211.5" x2="856" y2="211.5" stroke="#2e3237"/><text x="620" y="228" class="mono" font-size="10" fill="#8b9096">Sniff-test flags:</text><text x="620" y="243" class="sans" font-size="10.5" fill="#e4dfd4">E=1 is doing the work here, not demand.</text></g>
<text x="608" y="272" class="sans" font-size="11.5" fill="#93ad8c">Ranked, with the weak spots flagged.</text>
</g>
</svg>
